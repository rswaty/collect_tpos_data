<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LANDFIRE Tallgrass Prairie training polygons</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>LANDFIRE Tallgrass Prairie</h1>
    <span class="tag">Training polygon collector</span>
    <nav>
      <button class="tab active" data-tab="map-view">Map</button>
      <button class="tab" data-tab="table-view">Annotations <span id="annotation-count"></span></button>
    </nav>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div class="steps">
        <section class="step" id="step-name">
          <span class="step-mark">1</span>
          <div class="step-body">
            <h2><label for="annotator">Name</label></h2>
            <input id="annotator" type="text" autocomplete="name">
          </div>
        </section>

        <section class="step" id="step-label">
          <span class="step-mark">2</span>
          <div class="step-body">
            <h2>Label</h2>
            <p id="pending-summary" class="status"></p>
          </div>
        </section>

        <section class="step" id="step-classify">
          <span class="step-mark">3</span>
          <div class="step-body">
            <h2>Classify
              <button type="button" id="guide-open" class="icon" title="Interpretation guide" aria-label="Interpretation guide">?</button>
            </h2>
            <div id="cover-class" class="choices" role="radiogroup" aria-label="Cover type"></div>
            <div class="segmented" role="radiogroup" aria-label="Confidence">
              <label><input type="radio" name="confidence" value="High"><span>High</span></label>
              <label><input type="radio" name="confidence" value="Medium" checked><span>Medium</span></label>
              <label><input type="radio" name="confidence" value="Low"><span>Low</span></label>
            </div>
            <input id="notes" type="text" placeholder="Notes (optional)" aria-label="Notes">
          </div>
        </section>
      </div>

      <div class="actions">
        <button id="save" class="primary">Save</button>
        <details id="export-menu">
          <summary>Export</summary>
          <div class="menu">
            <button type="button" data-export="geojson">GeoJSON</button>
            <button type="button" data-export="csv">CSV</button>
          </div>
        </details>
      </div>
    </aside>

    <main>
      <div id="map-view" class="view active">
        <div id="map"></div>
      </div>
      <div id="table-view" class="view">
        <div class="table-tools">
          <button id="zoom-selected">Zoom to selected</button>
          <button id="delete-selected" class="danger">Delete selected</button>
          <span class="spacer"></span>
          <span class="muted">Saved in this browser only. Export to share.</span>
          <button id="export-geojson">Export GeoJSON</button>
          <button id="export-csv">Export CSV</button>
          <label class="button">Import GeoJSON<input id="import-geojson" type="file" accept=".geojson,.json" hidden></label>
        </div>
        <div class="table-wrap">
          <table id="annotation-table">
            <thead>
              <tr>
                <th><input type="checkbox" id="select-all"></th>
                <th>Created (UTC)</th><th>Annotator</th><th>Cover type</th><th>Confidence</th>
                <th>Acres</th><th>Imagery</th><th>Imagery date</th><th>Notes</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p id="table-empty" class="muted">No annotations saved yet.</p>
        </div>
      </div>
    </main>
  </div>

  <dialog id="guide">
    <div id="tips"></div>
    <form method="dialog"><button class="primary">Close</button></form>
  </dialog>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
  <script src="config.js"></script>
  <script src="data/tpos.js"></script>
  <script src="imagery.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
